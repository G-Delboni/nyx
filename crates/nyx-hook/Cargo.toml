[package]
name = "nyx-hook"
description = "Tiny binary invoked by Claude Code hooks; forwards events to the Nyx core"
version.workspace = true
edition.workspace = true

[[bin]]
name = "nyx-hook"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
anyhow.workspace = true
dirs.workspace = true
nyx-claude.workspace = true
ureq = { version = "3", default-features = false, features = ["json"] }

[dev-dependencies]
tempfile = "3"
