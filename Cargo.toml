[workspace]
resolver = "2"
members = ["app/src-tauri", "crates/nyx-claude", "crates/nyx-hook", "crates/nyx-ai", "crates/nyx-fakeclaude", "crates/nyx-voice"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
dirs = "6"
nyx-claude = { path = "crates/nyx-claude" }
nyx-ai = { path = "crates/nyx-ai" }
nyx-voice = { path = "crates/nyx-voice" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
